<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Wie rechnet man?</title>
  <style>
    :root{
      --paper:#eef4f8;
      --ink:#1b2430;
      --good:#2d6a4f;
      --bad:#a82828;
      --shadow:0 10px 28px rgba(25,42,58,.10);
      --cell:clamp(24px, 3.15vw, 42px);
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      font-family:"Segoe UI", Arial, sans-serif;
      background:var(--paper);
      color:var(--ink);
      overflow:hidden;
    }
    .app{
      min-height:100dvh;
      display:grid;
      grid-template-rows:auto 1fr auto;
      gap:10px;
      padding:clamp(10px,2vw,22px);
    }
    header{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:clamp(10px,1.8vh,16px);
    }
    h1{
      margin:0;
      font-size:clamp(28px,3.2vw,42px);
      font-weight:800;
    }
    main{
      min-height:0;
      display:flex;
      justify-content:center;
      align-items:flex-start;
      position:relative;
    }
    .boardWrap{
      position:relative;
      width:min(calc(var(--cell) * 29), 96vw);
      min-height:calc(var(--cell) * 10.5);
    }
    .math-board{
      width:calc(var(--cell) * 29);
      display:flex;
      flex-direction:column;
      gap:calc(var(--cell) * .6);
      align-items:flex-start;
      margin:0 auto;
    }
    .row{
      display:grid;
      grid-template-columns:repeat(29, var(--cell));
      min-height:var(--cell);
      width:calc(var(--cell) * 29);
      position:relative;
      opacity:0;
      transform:translateY(-8px);
      transition:opacity .8s ease, transform .8s ease;
    }
    .row.visible{opacity:1;transform:translateY(0)}
    .cell{
      width:var(--cell);
      height:var(--cell);
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:"Courier New", Consolas, monospace;
      font-size:calc(var(--cell) * .73);
      font-weight:700;
      line-height:1;
      position:relative;
      z-index:2;
    }
    .equals{color:#445568}
    .hiddenPart{opacity:0}

    .mark-red::before,
    .mark-blue::before,
    .mark-yellow::before{
      content:"";
      position:absolute;
      inset:3px;
      border-radius:10px;
      z-index:-1;
      animation:pulse 1s ease-in-out infinite;
    }
    .mark-red::before{background:rgba(217,65,65,.16); outline:3px solid rgba(217,65,65,.88)}
    .mark-blue::before{background:rgba(49,110,214,.16); outline:3px solid rgba(49,110,214,.88)}
    .mark-yellow::before{background:rgba(227,167,37,.16); outline:3px solid rgba(227,167,37,.88)}
    @keyframes pulse{50%{transform:scale(1.08)}}

    .messageOverlay{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      pointer-events:none;
      z-index:20;
    }
    .message{
      max-width:min(780px, 88vw);
      padding:18px 24px;
      border-radius:18px;
      background:rgba(255,255,255,.96);
      box-shadow:0 14px 35px rgba(26,42,57,.16);
      text-align:center;
      font-size:clamp(20px,2.4vw,30px);
      line-height:1.45;
      font-weight:700;
      white-space:pre-line;
      opacity:0;
      transform:translateY(8px) scale(.98);
      transition:opacity .55s ease, transform .55s ease;
    }
    .message.show{opacity:1;transform:translateY(0) scale(1)}

    footer{
      display:grid;
      gap:10px;
      justify-items:center;
      min-height:150px;
      align-content:start;
    }
    .quiz{
      width:min(1150px, 96vw);
      display:grid;
      gap:10px;
      justify-items:center;
      transition:opacity .4s ease, transform .4s ease;
    }
    .quiz.hide{opacity:0;transform:translateY(16px);pointer-events:none}
    .quizQuestion{
      font-size:clamp(20px,2.2vw,30px);
      font-weight:800;
    }
    .options{
      width:100%;
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:10px;
    }
    .optionBtn, .continueBtn{
      font:inherit;
      font-size:clamp(14px,1.45vw,20px);
      font-weight:700;
      padding:14px 10px;
      border-radius:14px;
      border:2px solid rgba(35,52,69,.12);
      background:rgba(255,255,255,.94);
      box-shadow:var(--shadow);
      cursor:pointer;
      transition:transform .18s ease, background .2s ease, border-color .2s ease, opacity .2s ease;
      white-space:nowrap;
    }
    .optionBtn:hover,.continueBtn:hover{transform:translateY(-1px)}
    .optionBtn.correct{background:#dff4e7;border-color:#7cbc93;color:var(--good)}
    .optionBtn.wrong{background:#fde6e6;border-color:#d8a0a0;color:var(--bad)}

    .correctFlash,
    .statusText{
      padding:10px 22px;
      border-radius:999px;
      box-shadow:var(--shadow);
      font-size:clamp(20px,2.3vw,30px);
      font-weight:800;
      opacity:0;
      transform:scale(.95);
      transition:opacity .25s ease, transform .25s ease;
    }
    .correctFlash{background:#dff4e7;color:var(--good)}
    .statusText{background:rgba(255,255,255,.94);color:var(--ink)}
    .correctFlash.show,
    .statusText.show{opacity:1;transform:scale(1)}

    .continueWrap{display:none;justify-content:center}
    .continueBtn{min-width:180px}

    @media (max-width: 980px){
      .options{grid-template-columns:repeat(2,1fr)}
      .boardWrap{transform:scale(.96); transform-origin: top center;}
    }
    @media (max-width: 620px){
      .options{grid-template-columns:1fr}
    }
    @media (max-height: 700px){
      :root{--cell:clamp(20px,3.8vh,34px)}
      .app{gap:6px; padding:8px 12px}
      header{gap:6px}
      .boardWrap{min-height:calc(var(--cell) * 9.2)}
      .math-board{gap:calc(var(--cell) * .45)}
      footer{min-height:120px;gap:6px}
      .optionBtn,.continueBtn{padding:10px 8px}
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Wie rechnet man?</h1>
    </header>

    <main>
      <div class="boardWrap">
        <div class="math-board">
          <div class="row visible" id="row0">
            <span class="cell" style="grid-column:2">1</span>
            <span class="cell" style="grid-column:3">8</span>
            <span class="cell" style="grid-column:5">+</span>
            <span class="cell outer1" style="grid-column:7">(</span>
            <span class="cell" style="grid-column:8">1</span>
            <span class="cell" style="grid-column:9">2</span>
            <span class="cell" style="grid-column:11">+</span>
            <span class="cell inner1" style="grid-column:13">(</span>
            <span class="cell" style="grid-column:14">1</span>
            <span class="cell" style="grid-column:15">0</span>
            <span class="cell" style="grid-column:17">−</span>
            <span class="cell" style="grid-column:19">5</span>
            <span class="cell inner1" style="grid-column:20">)</span>
            <span class="cell" style="grid-column:22">+</span>
            <span class="cell" style="grid-column:24">1</span>
            <span class="cell" style="grid-column:25">5</span>
            <span class="cell outer1" style="grid-column:27">)</span>
          </div>

          <div class="row" id="row1">
            <span class="cell equals" style="grid-column:2">=</span>
            <span class="cell row1rest hiddenPart" style="grid-column:4">1</span>
            <span class="cell row1rest hiddenPart" style="grid-column:5">8</span>
            <span class="cell row1rest hiddenPart" style="grid-column:7">+</span>
            <span class="cell row1rest hiddenPart outer2" style="grid-column:9">(</span>
            <span class="cell row1rest hiddenPart" style="grid-column:10">1</span>
            <span class="cell row1rest hiddenPart" style="grid-column:11">2</span>
            <span class="cell row1rest hiddenPart" style="grid-column:13">+</span>
            <span class="cell" id="innerResult5" style="grid-column:17">5</span>
            <span class="cell row1rest hiddenPart" style="grid-column:19">+</span>
            <span class="cell row1rest hiddenPart" style="grid-column:21">1</span>
            <span class="cell row1rest hiddenPart" style="grid-column:22">5</span>
            <span class="cell row1rest hiddenPart outer2" style="grid-column:24">)</span>
          </div>

          <div class="row" id="row2">
            <span class="cell equals" style="grid-column:2">=</span>
            <span class="cell" style="grid-column:4">1</span>
            <span class="cell" style="grid-column:5">8</span>
            <span class="cell" style="grid-column:7">+</span>
            <span class="cell" style="grid-column:15">3</span>
            <span class="cell" style="grid-column:16">2</span>
          </div>

          <div class="row" id="row3">
            <span class="cell equals" style="grid-column:2">=</span>
            <span class="cell" style="grid-column:11">5</span>
            <span class="cell" style="grid-column:12">0</span>
          </div>
        </div>

        <div class="messageOverlay"><div class="message" id="messageBox"></div></div>
      </div>
    </main>

    <footer>
      <div class="quiz" id="quizBox">
        <div class="quizQuestion" id="quizQuestion">Mit was beginnen wir?</div>
        <div class="options" id="options"></div>
      </div>

      <div class="continueWrap" id="continueWrap">
        <button class="continueBtn" id="continueBtn" type="button">Weiter</button>
      </div>

      <div class="correctFlash" id="correctFlash">Richtig!</div>
      <div class="statusText" id="statusText">Fertig</div>
    </footer>
  </div>

  <script>
    (() => {
      const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

      const quizBox = document.getElementById('quizBox');
      const quizQuestion = document.getElementById('quizQuestion');
      const optionsBox = document.getElementById('options');
      const continueWrap = document.getElementById('continueWrap');
      const continueBtn = document.getElementById('continueBtn');
      const correctFlash = document.getElementById('correctFlash');
      const statusText = document.getElementById('statusText');
      const messageBox = document.getElementById('messageBox');

      const row1 = document.getElementById('row1');
      const row2 = document.getElementById('row2');
      const row3 = document.getElementById('row3');
      const row1Rest = [...document.querySelectorAll('.row1rest')];
      const inner1 = [...document.querySelectorAll('.inner1')];
      const outer2 = [...document.querySelectorAll('.outer2')];
      const row2Parts = [...row2.querySelectorAll('.cell:not(.equals)')];

      let busy = false;
      let continueResolver = null;

      const quizzes = {
        start: {
          question: 'Mit was beginnen wir?',
          correct: 'Innere Klammer zuerst!',
          options: ['18 + 12', 'Äußere Klammer zuerst!', 'Innere Klammer zuerst!', '10 + 18']
        },
        outer: {
          question: 'Was machen wir jetzt?',
          correct: 'Klammer zuerst!',
          options: ['18 + 12', '5 + 15', 'Klammer zuerst!', '18 + 5']
        },
        final: {
          question: 'Was rechnen wir jetzt?',
          correct: '18 + 32',
          options: ['17 + 15', '18 + 15', '18 + 32', '32 + 5']
        }
      };

      function mark(elements, className, on=true){
        elements.forEach(el => el.classList.toggle(className, on));
      }

      function showMessage(text){
        messageBox.textContent = text;
        messageBox.classList.add('show');
      }
      function hideMessage(){
        messageBox.classList.remove('show');
      }
      async function messageFor(text, ms){
        showMessage(text);
        await wait(ms);
        hideMessage();
        await wait(700);
      }

      function flashCorrect(){
        correctFlash.classList.add('show');
        setTimeout(() => correctFlash.classList.remove('show'), 1100);
      }

      function hideQuiz(){
        quizBox.classList.add('hide');
        setTimeout(() => { quizBox.style.display = 'none'; }, 420);
      }

      function showQuiz(key, onCorrect){
        const quiz = quizzes[key];
        quizBox.style.display = 'grid';
        requestAnimationFrame(() => quizBox.classList.remove('hide'));
        quizQuestion.textContent = quiz.question;
        optionsBox.innerHTML = '';

        quiz.options.forEach(text => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'optionBtn';
          btn.textContent = text;
          btn.addEventListener('click', async () => {
            if (busy) return;
            if (text === quiz.correct) {
              busy = true;
              [...optionsBox.querySelectorAll('button')].forEach(b => b.disabled = true);
              btn.classList.add('correct');
              flashCorrect();
              await wait(1150);
              hideQuiz();
              await wait(520);
              await onCorrect();
              busy = false;
            } else {
              btn.classList.add('wrong');
              await wait(700);
              btn.classList.remove('wrong');
            }
          });
          optionsBox.appendChild(btn);
        });
      }

      function waitForContinue(){
        continueWrap.style.display = 'flex';
        return new Promise(resolve => {
          continueResolver = resolve;
        });
      }
      continueBtn.addEventListener('click', async () => {
        if (!continueResolver) return;
        continueWrap.style.display = 'none';
        const resolve = continueResolver;
        continueResolver = null;
        resolve();
      });

      async function runStartSequence(){
        mark(inner1, 'mark-red', true);
        await wait(3000);
        row1.classList.add('visible');
        await wait(1600);
        await messageFor('Alles was wir nicht verändert haben, wird in die nächste Zeile übertragen.', 5000);
        showMessage('MERKSATZ: Was noch nicht an der Reihe ist,\nschreibst du ab, so wie es ist!\nIn die nächste Zeile kommt es dann,\nweil man dort schön weiterrechnen kann!');
        await waitForContinue();
        hideMessage();
        await wait(600);
        row1Rest.forEach(el => el.classList.remove('hiddenPart'));
        await wait(1000);
        mark(inner1, 'mark-red', false);
        await wait(500);
        showQuiz('outer', runOuterSequence);
      }

      async function runOuterSequence(){
        mark(outer2, 'mark-blue', true);
        await wait(2800);
        await messageFor('Jetzt rechnen wir die Klammer.', 2800);

        const outerNumbers = [
          row1.children[5], row1.children[6],
          row1.children[8],
          row1.children[10], row1.children[11]
        ];
        mark(outerNumbers, 'mark-yellow', true);
        await wait(2800);
        mark(outerNumbers, 'mark-yellow', false);

        row2.classList.add('visible');
        await wait(1100);
        mark(outer2, 'mark-blue', false);
        await messageFor('12 + 5 + 15 = 32. Die drei Zahlen können wir direkt zusammenrechnen.', 3200);
        showQuiz('final', runFinalSequence);
      }

      async function runFinalSequence(){
        mark(row2Parts, 'mark-yellow', true);
        await wait(2600);
        mark(row2Parts, 'mark-yellow', false);
        row3.classList.add('visible');
        await wait(1000);
        await messageFor('Zum Schluss rechnen wir 18 + 32 = 50.', 2800);
        statusText.classList.add('show');
      }

      showQuiz('start', runStartSequence);
    })();
  </script>
</body>
</html>
